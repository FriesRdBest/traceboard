name: Feature request
description: Propose a focused, technically justified improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Requests should preserve Traceboard's separation of concerns and token governance model.
  - type: input
    id: problem
    attributes:
      label: Problem statement
      description: What concrete problem requires this change?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest complete solution.
    validations:
      required: true
  - type: textarea
    id: architecture
    attributes:
      label: Architecture impact
      description: Identify affected layers, contracts, and migration concerns.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List objectively verifiable outcomes.
    validations:
      required: true
