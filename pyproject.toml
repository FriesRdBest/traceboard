[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
scripts = { traceboard = "traceboard.cli.main:main" }
name = "traceboard"
version = "0.1.0"
description = "Traceboard: Design-system governance control room (core domain)"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.11"
authors = [
  { name = "Perplexity Design Systems", email = "design-systems@perplexity.ai" }
]
dependencies = [
  "pydantic>=2.13.5",
  "streamlit>=1.52.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=4.0.0",
  "ruff>=0.16.8",
  "pyright>=1.1.390",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/traceboard"]

# -------------------------
# Ruff configuration
# -------------------------
[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
extend-select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # Pyflakes
  "I",      # isort
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "UP",     # pyupgrade
  "TCH",    # flake8-type-checking
  "RUF",    # ruff-specific rules
  "SIM",    # flake8-simplify
  "PTH",    # flake8-use-pathlib
]
ignore = [
  "E501",   # line-length (we use formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["traceboard"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

# -------------------------
# Pyright configuration
# -------------------------
[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src/traceboard"]
exclude = [
  "**/__pycache__",
  "**/.venv",
  "**/node_modules",
]
reportMissingTypeStubs = false
reportImplicitStringConcatenation = false

# -------------------------
# Pytest configuration
# -------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
